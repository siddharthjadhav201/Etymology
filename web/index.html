    function wrapText(ctx, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = "";

      for (let i = 0; i < words.length; i++) {
        const testLine = currentLine + words[i] + " ";
        const width = ctx.measureText(testLine).width;

        if (width > maxWidth && currentLine !== "") {
          lines.push(currentLine.trim());
          currentLine = words[i] + " ";
        } else {
          currentLine = testLine;
        }
      }

      if (currentLine) {
        lines.push(currentLine.trim());
      }

      return lines;
    }

    function getCharSizeForContainer(maxLineCount, text, maxWidth, font, fontSize) {
      console.log(`maxlinecount : ${maxLineCount}, maxwidth : ${maxWidth}`)
      let CharCount = 0;
      let currentLineCount = 0;
      let cursorX = 0;
      let currentWordWidth = 0;
      const allLines = text.split("\n");
      let isFirst = true;
      for (const newLine of allLines) {
        if (!isFirst) {
          currentLineCount++;
          cursorX = 0;
          CharCount++;
        }
        if (currentLineCount > maxLineCount) {
          console.log(`currentLine : ${currentLineCount}`);
          return CharCount;
        }

        isFirst = false;
        const tokens = newLine.match(/\S+|\s+/g) || [];
        // const words = newLine.split(/\s+/);
        for (const word of tokens) {
          currentWordWidth = font.widthOfTextAtSize(`${word}`, fontSize);
          // console.log("currentWordWidth= " + currentWordWidth);
          if (cursorX + currentWordWidth > maxWidth) {
            console.log(`currentCursorX : ${cursorX}`)
            cursorX = 0;
            currentLineCount++;
            console.log(`first word of line : ${word}`);
            console.log("currentWordWidth= " + currentWordWidth);
            if (currentLineCount > maxLineCount) {
              console.log(`currentLine : ${currentLineCount}`);
              return CharCount;
            }
          }
          CharCount += word.length;
          cursorX += currentWordWidth;

        }
      }
      console.log(`currentLine : ${currentLineCount}`);
      return CharCount;
    }

    function getDataForSinglePage(
      wordIndex,

            if (nearestSpace < text.length) {

              while (nearestSpace > globalResult && isAlphanumeric(text[nearestSpace - 1])) {

    function getFittingText1({ text, highlightedWords, width, font, fontSize }) {
      // 1. Correctly clone and sort (Dart: highlightedWords.map((e) => e).toList())
      const highlightedRanges = [...highlightedWords].sort(
        (a, b) => a[0] - b[0]
      );

      console.log("sorted highlighted words data : " + highlightedRanges);

      const subParagraph = [];
      let globalResult = 0;
      let wordIndex = 0;
      let pageCount = 0;

      while (true) {
        const dataForSinglePage = getDataForSinglePage(
          wordIndex,
          highlightedRanges,
          text,
          globalResult,
          width,
          font,
          fontSize
        );

        if (dataForSinglePage !== null) {
          // DART LOGIC SYNC: 
          // We capture the CURRENT globalResult (the start of this page) 
          // BEFORE updating it to the next page's start.
          subParagraph.push([
            dataForSinglePage.text,
            dataForSinglePage.highlightedWords,
            dataForSinglePage.height,
            globalResult, // This is the 'start offset' for this chunk
          ]);

          // Update pointers for the next iteration
          wordIndex = dataForSinglePage.wordIndex;
          globalResult = dataForSinglePage.globalResult;
        } else {
          break;
        }

        // Safety breaks
        if (globalResult >= text.length || pageCount > 10) {
          break;
        }

        pageCount++;
      }

      return subParagraph;
    }


    function paragraphColumn(item, font) {
      const data = item[0];
      const startPosition = item[3];
      const highlightedWordsLocations = item[1];

      const spans = [];
      let globalStartPage = 0;

      for (const h of highlightedWordsLocations) {
        // normal text
        spans.push({
          text: data.substring(
            globalStartPage,
            h[0] - startPosition
          ),
          highlight: false,
        });

        // highlighted text
        spans.push({
          text: data.substring(
            h[0] - startPosition,
            h[1] - startPosition
          ),
          highlight: true,
        });

        globalStartPage = h[1] - startPosition;
      }

      // remaining text
      spans.push({
        text: data.substring(globalStartPage),
        highlight: false,
      });

      return spans;
    }
